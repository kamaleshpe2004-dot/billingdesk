<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing Desk</title>
<style>
:root{
  --ink:#1E2A26; --paper:#F6F4EE; --card:#FFFFFF;
  --teal:#0F3D3E; --teal-dark:#0A2B2C; --teal-soft:#E4EEEC;
  --amber:#E0982C; --amber-dark:#B87418;
  --line:#E2DFD4; --muted:#5B655F;
  --ok:#1F7A4C; --ok-bg:#EFF6F1; --ok-line:#CFE3D6;
  --warn:#8A5A0B; --warn-bg:#FBF3E7; --warn-line:#F0DDB8;
  --error:#B3261E; --error-bg:#FBE9E7; --error-line:#F1C7C2;
  --radius:12px; --shadow:0 2px 10px rgba(15,61,62,0.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--teal)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
#side{background:var(--teal);color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
.brand-mark{background:var(--amber);color:var(--teal-dark);font-weight:800;font-size:13px;padding:7px 8px;border-radius:9px}
.brand b{display:block;font-size:15px}
.brand small{display:block;color:#CFE3E0;font-size:11.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:#DCEBE8;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:var(--amber);color:var(--teal-dark);font-weight:600}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#9DBDB8;padding:14px 10px 4px}
.nav .bdg{background:rgba(255,255,255,.18);border-radius:10px;padding:0 7px;font-size:11.5px}
.nav button.on .bdg{background:rgba(10,43,44,.15)}
.nav .bdg.err{background:#C4473F;color:#fff}
#main{min-width:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5}
#bar h2{margin:0;font-size:1.2rem;flex:1;min-width:160px}
#barActions{display:flex;gap:8px;flex-wrap:wrap}
#saveBadge{font-size:12px;color:var(--muted);white-space:nowrap}
#saveBadge.warn{color:var(--warn);font-weight:600}
#view{padding:18px 22px 60px;max-width:1500px;width:100%}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:static;height:auto;padding:10px}
  .nav{display:flex;flex-wrap:wrap;gap:4px}
  .nav button{width:auto}
  .nav .grp{display:none}
  #view{padding:14px 16px 60px}
  #bar{padding:12px 16px}
}

/* ---------- building blocks ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:1rem}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:.86rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;border:2px solid transparent}
.kpi:hover{border-color:var(--teal-soft)}
.kpi .n{font-size:1.7rem;font-weight:700;color:var(--teal)}
.kpi .l{color:var(--muted);font-size:.84rem}
.kpi.alert .n{color:var(--error)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-dark)}
.btn.amb{background:var(--amber);border-color:var(--amber);color:var(--teal-dark)}
.btn.amb:hover{background:var(--amber-dark);color:#fff}
.btn.danger{color:var(--error);border-color:var(--error-line)}
.btn.danger:hover{background:var(--error-bg)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.link{border:0;background:none;color:var(--teal);padding:2px 4px;text-decoration:underline}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.chip{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;background:#EEE;color:#444}
.chip.draft{background:#ECEAE3;color:#5B655F}
.chip.sent{background:#E3EEF9;color:#1F5C99}
.chip.agreed,.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.err{background:var(--error-bg);color:var(--error)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.note{padding:10px 12px;border-radius:9px;font-size:.88rem;margin:0 0 12px}
.note.warn{background:var(--warn-bg);border:1px solid var(--warn-line)}
.note.ok{background:var(--ok-bg);border:1px solid var(--ok-line)}
.note.err{background:var(--error-bg);border:1px solid var(--error-line)}
.note.info{background:var(--teal-soft)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:#F1EFE8;text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t td{padding:7px 10px;border-bottom:1px solid #EFECE4;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#FAF8F2}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tfoot td{font-weight:700;background:#F7F5EF;border-top:1px solid var(--line)}
table.t tr.dead td{opacity:.5;text-decoration:line-through}
/* editable rows */
table.ed td{padding:2px 3px}
table.ed input,table.ed select{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;min-width:60px}
table.ed input:hover,table.ed select:hover{border-color:var(--line)}
table.ed input:focus,table.ed select:focus{border-color:var(--teal);outline:none;background:#fff}
table.t tr.added td{background:var(--ok-bg)}
table.t td.chg{background:var(--warn-bg);box-shadow:inset 0 -2px 0 var(--amber)}
table.ed td.ro{padding:6px 8px}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.fld b{color:var(--error)}
.fld input,.fld select,.fld textarea,.inp{border:1px solid #D6D2C5;border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);font-size:14px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:2px solid rgba(15,61,62,.25);border-color:var(--teal)}
.fld input[readonly]{background:#F4F2EC}
.fld small{color:#8A928D;font-size:11.5px}
.fld.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13.5px}
.fld.chk input{width:auto}
.fsec{grid-column:1/-1;font-weight:700;color:var(--teal);border-bottom:1px solid var(--line);padding:10px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.fsec:first-child{padding-top:0}
.fsec small{display:block;text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .inp{width:auto;min-width:130px;padding:6px 9px;font-size:13px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,30,30,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 14px;overflow:auto}
.mdl{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:640px;display:flex;flex-direction:column;max-height:calc(100vh - 60px)}
.mdl.wide{max-width:1180px}
.mdl.mid{max-width:860px}
.mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;flex:1;font-size:1.05rem}
.mh .x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
.mb{padding:16px 18px;overflow:auto;flex:1}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.9fr);gap:18px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.panel{background:#F8F7F2;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;align-self:start;position:sticky;top:0}
.panel h4{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--teal)}
.panel h4:first-child{margin-top:0}
.panel .kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.panel .kv b{font-weight:600}
.panel .tot{border-top:1px solid var(--line);margin-top:3px;padding-top:4px;font-weight:700}
.issues{list-style:none;margin:0;padding:0}
.issues li{padding:4px 8px;border-radius:6px;margin-bottom:4px;font-size:12.5px}
.issues li.error{background:var(--error-bg);color:var(--error)}
.issues li.warn{background:var(--warn-bg);color:var(--warn)}
.hist{max-height:150px;overflow:auto;font-size:12px;color:var(--muted)}
.hist div{padding:2px 0;border-bottom:1px dotted var(--line)}

/* template editor */
.tfl{display:grid;grid-template-columns:24px 1fr auto auto;gap:4px 6px;align-items:center}
.tfl .k{font-size:11px;color:#9AA29D}
.tfl input[type=text]{padding:4px 7px;border:1px solid #D6D2C5;border-radius:6px;width:100%}
.cfr{display:grid;grid-template-columns:1.3fr .8fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
.cfr input,.cfr select{padding:5px 7px;border:1px solid #D6D2C5;border-radius:6px;width:100%;min-width:0}
.pv{background:#E9E6DD;border-radius:10px;padding:14px;overflow:auto;max-height:70vh}
.pv .pvi{zoom:.62;background:#fff;padding:10mm;box-shadow:0 2px 8px rgba(0,0,0,.15);width:max-content;margin:0 auto}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--teal-dark);color:#fff;padding:9px 16px;border-radius:9px;box-shadow:var(--shadow);font-size:13.5px;max-width:90vw}
#toast div.err{background:var(--error)}
#toast div.warn{background:var(--amber-dark)}

/* ---------- printed documents ---------- */
#printArea{display:none}
@media print{
  html,body{background:#fff}
  #app,#modalRoot,#toast{display:none!important}
  #printArea{display:block}
}
@page{size:A4;margin:10mm}
@page a5{size:A5;margin:8mm}
@page land{size:A4 landscape;margin:10mm}
.doc{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;font-size:11.5px;line-height:1.35;break-after:page;width:190mm;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc:last-child{break-after:auto}
.doc.p-A5{page:a5;width:132mm}
.doc.land{page:land;width:277mm}
.doc table{border-collapse:collapse;width:100%}
.doc td,.doc th{border:1px solid #000;padding:4px 6px;vertical-align:top;text-align:left}
.doc th{background:#EEE;font-weight:700}
.doc .r{text-align:right}
.doc .c{text-align:center}
.doc .b{font-weight:700}
.doc .hd{text-align:center;border:1px solid #000;padding:8px 8px 6px}
.doc .hd .nm{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.doc .hd .ad{font-size:11px;white-space:pre-line}
.doc .ttl{font-weight:700;text-align:center;border:1px solid #000;border-top:0;padding:5px;letter-spacing:2px;background:#EEE}
.doc .lbl{color:#333;width:24%;white-space:nowrap}
.doc .big{font-size:15px;font-weight:700}
.doc .gap{height:8px}
.doc .ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:28px;font-size:11px}
.doc .ftn{font-size:10.5px;margin-top:8px;white-space:pre-line}
.doc .pty{white-space:pre-line}
.doc.ticket{width:80mm;font-family:'Courier New',Courier,monospace;font-size:12px;border:1px dashed #000;padding:4mm}
.doc.ticket .tc{text-align:center}
.doc.ticket .ln{display:flex;gap:6px}
.doc.ticket .ln span:first-child{width:42%;flex-shrink:0}
.doc.ticket hr{border:0;border-top:1px dashed #000;margin:5px 0}
.doc.ticket .bigw{font-size:14px;font-weight:700}
.doc .modbar{background:#222;color:#fff;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.doc .modbar .nm{font-size:17px;font-weight:700}
.doc .wbox{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.doc .wbox div{border:1.5px solid #000;padding:6px;text-align:center}
.doc .wbox b{display:block;font-size:16px}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><span class="brand-mark">BD</span><div><b>Billing Desk</b><small id="bizName">Transactions &amp; documents</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main id="main">
    <header id="bar"><h2 id="pageTitle"></h2><div id="barActions"></div><span id="saveBadge"></span></header>
    <div id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
'use strict';
/* =====================================================================
   Billing Desk — single-file version 1
   Data lives in this browser (localStorage) and, optionally, in a linked
   JSON data file. Nothing is sent anywhere.
   ===================================================================== */

// ---------- small helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const has = v => v !== null && v !== undefined && String(v).trim() !== '';
const num = v => { if (!has(v)) return 0; const n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const money = n => (+n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qf = (n, d = 3) => (+n || 0).toLocaleString('en-IN', { maximumFractionDigits: d });
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayISO = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const fmtDate = s => { if (!s) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? `${m[3]}-${m[2]}-${m[1]}` : s; };
const fmtDT = ts => ts ? new Date(ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const byId = (list, id) => id ? list.find(x => x.id === id) : undefined;
const normVeh = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const normInv = v => String(v || '').toUpperCase().replace(/\s+/g, '');
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
function fyOf(dateStr) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  const y = d.getFullYear(), s = d.getMonth() + 1 >= 4 ? y : y - 1;
  return pad2(s % 100) + '-' + pad2((s + 1) % 100);
}
function fyStartISO() { const d = new Date(); const y = d.getMonth() + 1 >= 4 ? d.getFullYear() : d.getFullYear() - 1; return y + '-04-01'; }
function addMinutes(hhmm, m) {
  const x = /^(\d{1,2}):(\d{2})/.exec(hhmm || ''); if (!x) return '';
  const t = (+x[1] * 60 + +x[2] + m + 1440) % 1440; return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
}

const STATES = { '01': 'Jammu & Kashmir', '02': 'Himachal Pradesh', '03': 'Punjab', '04': 'Chandigarh', '05': 'Uttarakhand', '06': 'Haryana', '07': 'Delhi', '08': 'Rajasthan', '09': 'Uttar Pradesh', '10': 'Bihar', '11': 'Sikkim', '12': 'Arunachal Pradesh', '13': 'Nagaland', '14': 'Manipur', '15': 'Mizoram', '16': 'Tripura', '17': 'Meghalaya', '18': 'Assam', '19': 'West Bengal', '20': 'Jharkhand', '21': 'Odisha', '22': 'Chhattisgarh', '23': 'Madhya Pradesh', '24': 'Gujarat', '25': 'Daman & Diu', '26': 'Dadra & Nagar Haveli and Daman & Diu', '27': 'Maharashtra', '29': 'Karnataka', '30': 'Goa', '31': 'Lakshadweep', '32': 'Kerala', '33': 'Tamil Nadu', '34': 'Puducherry', '35': 'Andaman & Nicobar Islands', '36': 'Telangana', '37': 'Andhra Pradesh', '38': 'Ladakh', '97': 'Other Territory' };
const STATE_OPTS = [['', '— from GSTIN —'], ...Object.entries(STATES).map(([c, n]) => [c, c + ' · ' + n])];

// ---------- GSTIN ----------
const GST_CH = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function gstCheckChar(s14) {
  let s = 0;
  for (let i = 0; i < 14; i++) { const p = GST_CH.indexOf(s14[i]) * (i % 2 ? 2 : 1); s += Math.floor(p / 36) + (p % 36); }
  return GST_CH[(36 - (s % 36)) % 36];
}
function gstinStatus(g) {
  g = String(g || '').toUpperCase().trim();
  if (!g) return 'missing';
  if (!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)) return 'format';
  if (!STATES[g.slice(0, 2)]) return 'state';
  if (gstCheckChar(g.slice(0, 14)) !== g[14]) return 'checksum';
  return 'ok';
}
const GST_MSG = { format: 'wrong format', state: 'unknown state code', checksum: 'check digit does not match — likely a typo' };
function partyState(p) {
  if (!p) return '';
  const g = String(p.gstin || '').trim();
  if (/^\d{2}/.test(g) && STATES[g.slice(0, 2)]) return g.slice(0, 2);
  return p.stateCode || '';
}
const VEH_RE = /^([A-Z]{2}\d{1,2}[A-Z]{0,3}\d{4}|\d{2}BH\d{4}[A-Z]{1,2})$/;

// ---------- amount in words (Indian system) ----------
function inWords(n) {
  n = Math.round((+n || 0) * 100) / 100;
  const rupees = Math.floor(n), paise = Math.round((n - rupees) * 100);
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' + two(x % 100) : '') : two(x);
  const conv = x => {
    if (x === 0) return 'Zero';
    const out = [];
    const cr = Math.floor(x / 1e7); x %= 1e7;
    const l = Math.floor(x / 1e5); x %= 1e5;
    const t = Math.floor(x / 1000); x %= 1000;
    if (cr) out.push(conv(cr) + ' Crore');
    if (l) out.push(two(l) + ' Lakh');
    if (t) out.push(two(t) + ' Thousand');
    if (x) out.push(three(x));
    return out.join(' ');
  };
  return 'Rupees ' + conv(rupees) + (paise ? ' and ' + two(paise) + ' Paise' : '') + ' Only';
}

/* =====================================================================
   Data store
   ===================================================================== */
const KEY = 'billingdesk.v1';
function blankDb() {
  return {
    v: 1, savedAt: 0,
    settings: { bizName: '', txPrefix: 'TR-', txNext: 1, sumPrefix: 'SUM-', sumNext: 1, ewbLimit: 50000 },

function nextNumber(ent, date) {
  const n = Math.max(1, Math.floor(num(ent.next) || 1)); ent.next = n + 1;
  return String(ent.prefix || '').replace(/\{FY\}/g, fyOf(date)) + String(n).padStart(Math.max(1, Math.floor(num(ent.pad) || 3)), '0');

// Generate (assign numbers if needed), record, and print.
async function generateDocs(txs, kinds) {
  let html = '', done = 0;
  const skipped = [];
  for (const tx of txs) {
    const errs = checkTx(tx).filter(i => i.sev === 'error');
    if (errs.length) { skipped.push(`${tx.code}: ${errs.map(e => e.msg).join('; ')}`); continue; }
    for (const kind of kinds) {
      const ent = kind === 'ws' ? byId(db.bridges, tx.bridgeId) : byId(db.freight, tx.freightId);
      if (!ent) { skipped.push(`${tx.code}: no ${kind === 'ws' ? 'weighbridge' : 'freight company'} selected`); continue; }
      tx.docs = tx.docs || {};
      if (kind === 'ws') {
        if (!has(tx.slipNo)) tx.slipNo = nextNumber(ent, tx.wsDate || tx.invDate || tx.date);
        if (!tx.docs.ws) (tx.history = tx.history || []).push({ at: Date.now(), msg: 'Weighment slip ' + tx.slipNo + ' printed' });
        tx.docs.ws = { at: Date.now(), no: tx.slipNo };
      } else {
        if (!has(tx.fbNo)) tx.fbNo = nextNumber(ent, tx.fbDate || tx.invDate || tx.date);
        if (!tx.docs.fb) (tx.history = tx.history || []).push({ at: Date.now(), msg: 'Freight bill ' + tx.fbNo + ' printed' });
        tx.docs.fb = { at: Date.now(), no: tx.fbNo };
      }
      html += renderDoc(tx, kind); done++;
    }
  }
  if (done) {
    log(`Printed ${done} document(s) for ${txs.length === 1 ? txs[0].code : txs.length + ' transactions'}`);
    save(); render();
    const kindName = kinds.length === 2 ? 'Documents' : kinds[0] === 'ws' ? 'Weighment Slip' : 'Freight Bill';
    const title = txs.length === 1 ? `${txs[0].code} - ${calc(txs[0]).buyer?.name || ''} - ${kindName}` : `${kindName} - ${txs.length} transactions - ${todayISO()}`;
    printHTML(html, title);
  }
  if (skipped.length) {
    openModal({ title: done ? 'Some documents were skipped' : 'Nothing printed', html: `<p class="muted">Fix these and print again. Use <b>Checks</b> to see all issues.</p><ul class="issues">${skipped.map(s => `<li class="error">${esc(s)}</li>`).join('')}</ul>`, buttons: [{ label: 'OK', cls: 'pri' }] });
  }
}

let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) xlsxPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => { xlsxPromise = null; rej(new Error('Excel library could not load (needs internet)')); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}
function download(name, text, type = 'text/plain') {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
async function exportRows(name, rows) {
  if (!rows.length) return toast('Nothing to export', 'warn');
  try {
    const X = await loadXLSX(); const ws = X.utils.json_to_sheet(rows); const wb = X.utils.book_new();
    ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.min(40, Math.max(10, k.length + 2, ...rows.slice(0, 50).map(r => String(r[k] ?? '').length + 1))) }));
    X.utils.book_append_sheet(wb, ws, 'Data'); X.writeFile(wb, name + '.xlsx');
  } catch (e) {
    const keys = Object.keys(rows[0]);
    const csv = [keys, ...rows.map(r => keys.map(k => r[k]))].map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
    download(name + '.csv', '﻿' + csv, 'text/csv'); toast(e.message + ' — saved as CSV instead', 'warn');
  }
}
async function readSheetFile(file) {
  if (/\.csv$/i.test(file.name)) {
    const lines = (await file.text()).split(/\r?\n/).filter(l => l.trim());
    const split = l => { const out = []; let cur = '', q = false; for (let i = 0; i < l.length; i++) { const ch = l[i]; if (q) { if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; } else if (ch === '"') q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; };
    const head = split(lines[0]).map(h => h.replace(/^﻿/, '').trim());
    return lines.slice(1).map(l => { const c = split(l); const o = {}; head.forEach((h, i) => o[h] = c[i] ?? ''); return o; });
  }
  const X = await loadXLSX();
  const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: false, dateNF: 'yyyy-mm-dd' });
}
function pickFile(accept) {
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => res(i.files[0] || null); i.click(); });
}
function toISO(v) {
  if (!has(v)) return '';
  const s = String(v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/.exec(s); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad2(m[2])}-${pad2(m[1])}`; }
  const d = new Date(s); return isNaN(d) ? s : isoOf(d);
}

function sampleTxFor(kind, ent) {

}
function editTemplate(kind, entId) {
  const list = kind === 'ws' ? db.bridges : db.freight;
  const ent = byId(list, entId); if (!ent) return;
  let tpl = JSON.parse(JSON.stringify(normTpl(ent.tpl, kind)));
  const sample = sampleTxFor(kind, ent);
  const m = openModal({
    title: `${kind === 'ws' ? 'Weighment slip' : 'Freight bill'} template · ${ent.name}`, size: 'wide',
    html: `<div class="split"><div id="tplCfg"></div><div><div class="row small muted" style="margin-bottom:6px">Live preview ${sample.id === '_sample' ? '(sample data)' : 'using ' + esc(sample.code)}</div><div class="pv"><div class="pvi" id="tplPv"></div></div></div></div>`,
    buttons: [{ label: 'Reset to default', cls: 'danger', left: true, onClick: async () => { if (await confirmBox('Reset this template to the default layout and fields?', 'Reset', true)) { tpl = defaultTpl(kind); draw(); } return false; } },
      { label: 'Cancel' }, { label: 'Save template', cls: 'pri', onClick: () => { ent.tpl = tpl; log(`Template updated: ${ent.name}`); save(); render(); toast('Template saved'); } }]
  });
  const cfg = $('#tplCfg', m.el);
  const preview = () => {
    const tmp = { ...ent, tpl }; const saved = list.indexOf(ent); list[saved] = tmp;
    try { $('#tplPv', m.el).innerHTML = renderDoc(sample, kind); } finally { list[saved] = ent; }
  };
  const draw = () => {
    cfg.innerHTML = `<div class="form">
      <label class="fld"><span>Layout</span><select data-t="layout">${optHTML(LAYOUTS[kind], tpl.layout)}</select></label>
      <label class="fld"><span>Paper</span><select data-t="paper">${optHTML([['A4', 'A4'], ['A5', 'A5']], tpl.paper)}</select></label>
      <label class="fld wide"><span>Document title</span><input data-t="title" value="${esc(tpl.title)}"></label>
      <label class="fld wide"><span>Extra header line (optional)</span><input data-t="header" value="${esc(tpl.header)}" placeholder="e.g. Approved by Legal Metrology, Lic. No. …"></label>
      ${kind === 'fb' ? `<label class="fld wide"><span>Terms</span><textarea data-t="terms" rows="2">${esc(tpl.terms)}</textarea></label>` : ''}
      <label class="fld wide"><span>Footer note</span><input data-t="footer" value="${esc(tpl.footer)}"></label></div>
      <div class="fsec" style="margin-top:12px">Standard fields <small>Tick to show, rename to match this company's wording, ↑↓ to reorder.</small></div>
      <div class="tfl">${tpl.fields.map((f, i) => `<input type="checkbox" data-fs="${i}" ${f.show ? 'checked' : ''}><div><input type="text" data-fl="${i}" value="${esc(f.label)}"><div class="k">${esc((kind === 'ws' ? WS_FIELDS : FB_FIELDS).find(x => x[0] === f.k)?.[1] || f.k)}</div></div><button class="btn sm" data-up="${i}" ${i ? '' : 'disabled'}>↑</button><button class="btn sm" data-dn="${i}" ${i < tpl.fields.length - 1 ? '' : 'disabled'}>↓</button>`).join('')}</div>
      <div class="fsec" style="margin-top:12px">Extra fields <small>Fixed: same text on every document. Per transaction: typed on each transaction. ${kind === 'fb' ? 'Charge: an amount added to the bill total.' : ''}</small></div>
      ${tpl.custom.length ? `<div class="cfr small muted"><span>Label</span><span>Type</span><span>Value comes from</span><span>Value / default</span><span></span></div>` : ''}
      ${tpl.custom.map((c, i) => `<div class="cfr"><input data-cl="${i}" value="${esc(c.label)}" placeholder="Label"><select data-ct="${i}">${optHTML(kind === 'fb' ? [['text', 'Text'], ['amount', 'Charge (₹)']] : [['text', 'Text'], ['amount', 'Amount (₹)']], c.type)}</select><select data-cp="${i}">${optHTML([['0', 'Fixed'], ['1', 'Per transaction']], c.perTx ? '1' : '0')}</select><input data-cv="${i}" value="${esc(c.value)}" placeholder="${c.perTx ? 'Default (optional)' : 'Value'}"><button class="btn sm danger" data-cx="${i}">✕</button></div>`).join('')}
      <button class="btn sm" data-cadd="1">+ Add extra field</button>`;
    preview();
  };
  cfg.addEventListener('input', e => {
    const el = e.target, d = el.dataset;
    if (d.t) tpl[d.t] = el.value;
    else if (d.fl !== undefined) tpl.fields[+d.fl].label = el.value;
    else if (d.cl !== undefined) tpl.custom[+d.cl].label = el.value;
    else if (d.cv !== undefined) tpl.custom[+d.cv].value = el.value;
    preview();
  });
  cfg.addEventListener('change', e => {
    const el = e.target, d = el.dataset;
    if (d.fs !== undefined) tpl.fields[+d.fs].show = el.checked;
    else if (d.ct !== undefined) tpl.custom[+d.ct].type = el.value;
    else if (d.cp !== undefined) { tpl.custom[+d.cp].perTx = el.value === '1'; draw(); return; }

    else if (d.cadd) tpl.custom.push({ id: uid().slice(0, 6), label: '', type: 'text', perTx: false, value: '' });
    else return;
    draw();
  });
  draw();
}

function viewChecks() {

  const mrows = checkMasters();
  const errs = rows.filter(r => r.sev === 'error'), warns = rows.filter(r => r.sev === 'warn' && !/not entered yet/.test(r.msg));
  const waiting = rows.filter(r => /not entered yet/.test(r.msg)).length;
  const tbl = list => `<div class="tw"><table class="t"><thead><tr><th>ID</th><th>Client</th><th>Buyer</th><th>Issue</th><th></th></tr></thead><tbody>${list.map(r => { const c = calc(r.t); return `<tr><td><b>${esc(r.t.code)}</b></td><td>${esc(c.client?.name || '')}</td><td>${esc(c.buyer?.name || '')}</td><td><span class="chip ${r.sev === 'error' ? 'err' : 'warn'}">${r.sev === 'error' ? 'Error' : 'Warning'}</span> ${esc(r.msg)}</td><td><button class="btn sm" data-act="editTx" data-id="${r.t.id}">Fix</button></td></tr>`; }).join('')}</tbody></table></div>`;

async function restoreBackup() {

    if (!(await confirmBox(`Replace ALL current data with the backup "${file.name}" (${d.tx.length} transactions)?`, 'Replace', true))) return;
    db = migrate(d); log('Restored from backup ' + file.name); save(); render(); toast('Backup restored');

  sumSent: async () => { const s = byId(db.summaries, ui.sumId); const ver = s.versions[s.versions.length - 1]; if (!ver.rows.length) return toast('Add at least one row', 'warn'); const bad = ver.rows.filter(r => !r.buyerId || !(num(r.qty) > 0) || !(num(r.rate) > 0)); if (bad.length && !(await confirmBox(`${bad.length} row(s) are missing buyer, quantity or rate. Mark as sent anyway?`, 'Mark as sent'))) return; ver.sentOn = Date.now(); s.status = 'sent'; log(`${s.no} v${ver.v} sent to client`); save(); render(); toast('Locked as sent. Use “Print for client” or “Export Excel” to share it.'); },
  sumNewVer: () => { const s = byId(db.summaries, ui.sumId); const ver = s.versions[s.versions.length - 1]; s.versions.push({ v: ver.v + 1, created: Date.now(), rows: ver.rows.map(r => ({ ...r })) }); s.status = 'draft'; ui.sumVer = null; log(`${s.no}: v${ver.v + 1} started (client asked for changes)`); save(); render(); toast(`Version ${ver.v + 1} created — make the client's changes`); },
  sumAgreed: async () => { const s = byId(db.summaries, ui.sumId); const ver = s.versions[s.versions.length - 1]; if (!ver.rows.length) return toast('No rows to agree', 'warn'); const bad = ver.rows.filter(r => !r.buyerId || !(num(r.qty) > 0) || !(num(r.rate) > 0)); if (bad.length) return toast(`${bad.length} row(s) are missing buyer, quantity or rate`, 'err'); if (!(await confirmBox(`Record that the client agreed to v${ver.v} (${ver.rows.length} invoices)? This version will be locked.`, 'Client agreed'))) return; if (!ver.sentOn) ver.sentOn = Date.now(); ver.agreedOn = Date.now(); s.status = 'agreed'; s.agreedV = ver.v; log(`${s.no} v${ver.v} agreed by client`); save(); render(); },
  sumReopen: async () => { const s = byId(db.summaries, ui.sumId); if (!(await confirmBox('Reopen this summary? It goes back to "sent" so you can start a new version.', 'Reopen'))) return; s.status = 'sent'; delete s.agreedV; log(`${s.no} reopened`); save(); render(); },
  sumCreateTx: async () => { const s = byId(db.summaries, ui.sumId); if (s.converted) return; const ver = s.versions.find(v => v.v === s.agreedV); if (!(await confirmBox(`Create ${ver.rows.length} transaction(s) from ${s.no} v${ver.v}?`, 'Create'))) return; createTxFromSummary(s); },
  sumShowTx: () => { const s = byId(db.summaries, ui.sumId); ui.tf = { q: s.no, client: '', stage: '', from: '', to: '', deleted: false }; go('transactions'); },
  sumDiscard: async () => { const s = byId(db.summaries, ui.sumId); if (s.versions.length < 2) return; if (!(await confirmBox(`Discard draft v${s.versions.length}? You go back to v${s.versions.length - 1} as sent.`, 'Discard', true))) return; s.versions.pop(); s.status = 'sent'; ui.sumVer = null; log(`${s.no}: draft v${s.versions.length + 1} discarded`); save(); render(); },
  sumDelete: async () => { const s = byId(db.summaries, ui.sumId); if (!(await confirmBox(`Delete summary ${s.no}? This cannot be undone.`, 'Delete', true))) return; db.summaries = db.summaries.filter(x => x.id !== s.id); log(`${s.no} deleted`); save(); go('summaries'); },
  sumPrint: () => { const s = byId(db.summaries, ui.sumId); const vi = ui.sumVer ?? s.versions.length - 1; const ver = s.versions[vi]; printHTML(sumPrintHTML(s, ver), `${s.no} v${ver.v} - ${byId(db.clients, s.clientId)?.name || ''}`); },
  sumExport: () => { const s = byId(db.summaries, ui.sumId); const ver = s.versions[ui.sumVer ?? s.versions.length - 1]; exportRows(`${s.no} v${ver.v} - ${byId(db.clients, s.clientId)?.name || ''}`, ver.rows.map((r, i) => { const c = calc(rowTx(s, r)); return { '#': i + 1, 'Date': fmtDate(r.date), 'Buyer': c.buyer?.name || '', 'Buyer GSTIN': c.buyer?.gstin || '', 'Goods': c.desc, 'HSN': c.hsn, 'Qty': c.qty, 'Unit': c.unit, 'Rate': c.rate, 'Taxable': c.taxable, 'GST %': c.gst, 'GST': c.tax, 'Invoice Value': c.total, 'Vehicle': r.vehicle, 'From': r.from, 'To': r.to, 'Freight Co.': c.fc?.name || '', 'Weighbridge': byId(db.bridges, r.bridgeId)?.name || '', 'Note': r.note }; })); },
  newTx: () => { if (!db.clients.length || !db.buyers.length) { toast('Add at least one client and one buyer first', 'warn'); return go(db.clients.length ? 'm:buyers' : 'm:clients'); } editTx(null); },
  editTx: b => editTx(b.dataset.id),
  txRestore: b => { const t = byId(db.tx, b.dataset.id); t.deleted = false; t.history.push({ at: Date.now(), msg: 'Restored' }); log(`${t.code} restored`); save(); render(); },
  printTx: b => generateDocs([byId(db.tx, b.dataset.id)], b.dataset.k.split(',')),
  bulkPrint: b => generateDocs(filteredTx().filter(t => ui.sel.has(t.id) && !t.deleted), b.dataset.k.split(',')),
  printReady: () => generateDocs(liveTx().filter(t => !t.delivered && has(t.invNo) && (!(t.docs?.ws && t.docs?.fb) || docsOutdated(t)) && !checkTx(t).some(i => i.sev === 'error')), ['ws', 'fb']),
  bulkDelivered: () => { let n = 0; filteredTx().filter(t => ui.sel.has(t.id) && !t.delivered).forEach(t => { t.delivered = true; t.history.push({ at: Date.now(), msg: 'Marked delivered' }); n++; }); log(`${n} transaction(s) marked delivered`); ui.sel.clear(); save(); render(); toast(`${n} marked delivered`); },
  bulkExport: () => { const l = filteredTx(); exportRows('Transactions ' + todayISO(), (ui.sel.size ? l.filter(t => ui.sel.has(t.id)) : l).map(registerRow)); },
  tfClear: () => { ui.tf = { q: '', client: '', stage: '', from: '', to: '', deleted: false }; render(); },
  tallyExport: b => { const l = liveTx().filter(t => b.dataset.w === 'all' || !has(t.invNo)).sort((a, b2) => a.code.localeCompare(b2.code)); exportRows('For Tally ' + todayISO(), l.map(tallyRow)); },
  tallySave: () => tallySave(),
  tallyImport: () => tallyImport(),
  tplEdit: b => editTemplate(b.dataset.kind, b.dataset.id),
  mAdd: b => editMaster(b.dataset.m, null),
  mEdit: b => editMaster(b.dataset.m, b.dataset.id),
  repExport: () => { const r = ui.rep, [gl, gf] = GROUPS[r.by]; const m = new Map(); repRows().forEach(t => { const c = calc(t), k = gf(t); const g = m.get(k) || { [gl]: k, Count: 0, 'Weight (MT)': 0, Taxable: 0, GST: 0, 'Invoice Value': 0, 'Freight Bills': 0 }; g.Count++; g['Weight (MT)'] = r2(g['Weight (MT)'] + (c.netKg || 0) / 1000); g.Taxable = r2(g.Taxable + c.taxable); g.GST = r2(g.GST + c.tax); g['Invoice Value'] = r2(g['Invoice Value'] + c.total); g['Freight Bills'] = r2(g['Freight Bills'] + c.fTotal); m.set(k, g); }); exportRows(`Report by ${gl} ${r.from} to ${r.to}`, [...m.values()]); },
  regExport: () => exportRows(`Register ${ui.rep.from} to ${ui.rep.to}`, repRows().map(registerRow)),
  saveSettings: () => { const f = readForm($('#setForm')); Object.assign(db.settings, f, { txNext: Math.max(1, Math.floor(num(f.txNext)) || 1), sumNext: Math.max(1, Math.floor(num(f.sumNext)) || 1), ewbLimit: num(f.ewbLimit) || 50000 }); log('Settings updated'); save(); render(); toast('Settings saved'); },
  backup: () => { download(`billing-desk-backup-${todayISO()}.json`, JSON.stringify(db, null, 1), 'application/json'); log('Backup downloaded'); save(); },
  restore: () => restoreBackup(),
  clearAll: async () => { if (!(await confirmBox('Erase ALL data in this browser — masters, summaries, transactions, templates? Download a backup first if unsure. A linked data file will also be overwritten.', 'Erase everything', true))) return; db = blankDb(); save(); go('dashboard'); toast('All data erased'); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  // checkboxes / empty space in a [data-stop] cell shouldn't open the clickable row
  const stop = e.target.closest('[data-stop]');
  if (stop && b.contains(stop)) return;
  if (e.target.tagName === 'INPUT' && b.tagName === 'TR') return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});

// ---------- start ----------
render();
initFile();
</script>
</body>
</html>
